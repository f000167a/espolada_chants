<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHANT BOOK — エスポラーダ北海道</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --blue: #29abe2;
  --blue-dark: #1a8fc4;
  --blue-light: #e8f6fd;
  --blue-mid: rgba(41,171,226,0.15);
  --text: #1a2a3a;
  --muted: #7a8a9a;
  --border: #d8eaf5;
  --bg: #f4f9fd;
  --surface: #ffffff;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  max-width: 580px;
  margin: 0 auto;
  padding-bottom: 60px;
}

/* ── HEADER ── */
.header {
  background: var(--blue);
  padding: 28px 24px 24px;
  position: relative;
  overflow: hidden;
}

.header::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 180px; height: 180px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
}

.header::after {
  content: '';
  position: absolute;
  bottom: -60px; left: 40px;
  width: 140px; height: 140px;
  border-radius: 50%;
  background: rgba(255,255,255,0.07);
}

.header-top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
  position: relative;
  z-index: 1;
}

.header-brand {
  font-size: 0.7rem;
  letter-spacing: 0.25em;
  color: rgba(255,255,255,0.7);
  text-transform: uppercase;
}

.schedule-block {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(255,255,255,0.18);
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 10px;
  padding: 6px 12px;
  text-decoration: none;
  transition: background 0.15s;
}

.schedule-block:hover {
  background: rgba(255,255,255,0.28);
}

.schedule-icon { font-size: 1rem; }

.schedule-text {
  font-size: 0.78rem;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
}

.header-title {
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: 1.8rem;
  font-weight: 900;
  color: #fff;
  line-height: 1.1;
  margin-bottom: 10px;
  position: relative;
  z-index: 1;
}

.header-sub {
  font-size: 0.82rem;
  color: rgba(255,255,255,0.85);
  line-height: 1.6;
  position: relative;
  z-index: 1;
}

.next-match-banner {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.15);
  border: 1.5px solid rgba(255,255,255,0.35);
  border-radius: 12px;
  padding: 9px 14px;
  margin-top: 14px;
  text-decoration: none;
  position: relative;
  z-index: 1;
}

.next-match-banner:hover {
  background: rgba(255,255,255,0.24);
}

.next-match-banner-label {
  font-size: 0.68rem;
  font-weight: 700;
  color: rgba(255,255,255,0.75);
  letter-spacing: 0.05em;
  white-space: nowrap;
}

.next-match-banner-body {
  font-size: 0.78rem;
  font-weight: 700;
  color: #fff;
  line-height: 1.5;
}

.header-nav {
  margin-top: 14px;
  position: relative;
  z-index: 1;
}

.header-nav a {
  font-size: 0.75rem;
  color: rgba(255,255,255,0.8);
  text-decoration: none;
  border: 1px solid rgba(255,255,255,0.4);
  padding: 5px 14px;
  border-radius: 20px;
  transition: all 0.15s;
}

.header-nav a:hover {
  background: rgba(255,255,255,0.15);
  color: #fff;
}

/* ── LEGEND ── */
.legend-bar {
  margin: 16px 20px 0;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #fff8e1;
  border: 1px solid #ffe082;
  border-radius: 8px;
  padding: 7px 14px;
  font-size: 0.8rem;
  color: #7a6000;
}

.legend-bar strong {
  font-weight: 900;
}

/* ── TABS ── */
.tabs-wrap {
  padding: 20px 20px 0;
}

.tabs {
  display: flex;
  background: var(--surface);
  border-radius: 12px;
  padding: 4px;
  border: 1.5px solid var(--border);
  gap: 4px;
}

.tab {
  flex: 1;
  padding: 11px;
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  border-radius: 8px;
  border: none;
  background: none;
  font-family: 'Noto Sans JP', sans-serif;
  transition: all 0.15s;
}

.tab:hover { color: var(--blue); }

.tab.active {
  background: var(--blue);
  color: #fff;
}

/* ── LIST ── */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.list-wrap {
  padding: 12px 20px 0;
}

.item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px 16px;
  background: var(--surface);
  border-radius: 12px;
  border: 1.5px solid var(--border);
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.item:hover {
  border-color: var(--blue);
  box-shadow: 0 2px 10px rgba(41,171,226,0.12);
}

.item.wip {
  opacity: 0.4;
  cursor: default;
}

.item.wip:hover {
  border-color: var(--border);
  box-shadow: none;
}

.item-name {
  flex: 1;
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  color: var(--text);
}

.item-badges {
  display: flex;
  gap: 6px;
  align-items: center;
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 700;
  white-space: nowrap;
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: all 0.15s;
}

.badge-call {
  background: var(--blue-light);
  border-color: var(--border);
  color: var(--blue-dark);
}

.badge-call:hover {
  background: var(--blue-mid);
  border-color: var(--blue);
}

.badge-chant {
  background: var(--blue);
  color: #fff;
}

.badge-chant:hover { background: var(--blue-dark); }

.badge-lyrics {
  background: var(--blue-light);
  border-color: var(--border);
  color: var(--blue-dark);
}

.badge-lyrics:hover {
  background: var(--blue-mid);
  border-color: var(--blue);
}

.item-chevron {
  color: var(--muted);
  font-size: 1rem;
}

/* ── MODAL ── */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 100;
  backdrop-filter: blur(4px);
  align-items: flex-end;
  justify-content: center;
}

.overlay.open { display: flex; }

.modal {
  background: var(--surface);
  border-top: 4px solid var(--blue);
  width: 100%;
  max-width: 580px;
  padding: 0 0 40px;
  border-radius: 18px 18px 0 0;
  animation: slide-up 0.22s cubic-bezier(0.32,0.72,0,1);
  max-height: 82vh;
  overflow-y: auto;
}

@media (min-width: 600px) {
  .overlay { align-items: center; }
  .modal {
    border-top: none;
    border: 2px solid var(--border);
    border-radius: 18px;
    max-width: 480px;
    animation: fade-in 0.18s ease;
    box-shadow: 0 8px 40px rgba(0,0,0,0.15);
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
}

@keyframes slide-up {
  from { transform: translateY(40px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

.modal-close-row {
  display: flex;
  justify-content: flex-end;
  padding: 14px 16px 0;
}

.close-btn {
  background: var(--bg);
  border: none;
  color: var(--muted);
  font-size: 1.1rem;
  width: 34px; height: 34px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.12s;
}

.close-btn:hover { background: var(--blue-light); color: var(--blue); }

.modal-body { padding: 8px 22px 0; }

.modal-type {
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.15em;
  margin-bottom: 4px;
}

.modal-title {
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: 1.4rem;
  font-weight: 900;
  margin-bottom: 14px;
  line-height: 1.3;
}

.modal-origin {
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 14px;
}

.modal-section-label {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.12em;
  margin-bottom: 8px;
  margin-top: 16px;
}

.modal-lines {
  background: var(--blue-light);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 6px;
}

.modal-lines.is-call {
  background: #f6f8fa;
  border-color: #e0e8f0;
}

.modal-line {
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--blue-dark);
  line-height: 2;
}

.modal-line.is-call-line { color: var(--text); }

.modal-legend {
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: 8px;
}

.modal-divider {
  height: 1px;
  background: var(--border);
  margin: 18px 0 4px;
}

.audio-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.play-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--surface);
  color: var(--blue);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s;
}

.play-btn:hover:not(:disabled) {
  background: var(--blue-light);
  border-color: var(--blue);
}

.play-btn.playing {
  background: var(--blue-light);
  border-color: var(--blue);
  animation: ring 1s ease infinite;
}

.play-btn:disabled { border-color: var(--border); color: #ccc; cursor: default; }

@keyframes ring {
  0%,100%{ box-shadow: 0 0 0 0 rgba(41,171,226,0.4); }
  50%    { box-shadow: 0 0 0 8px rgba(41,171,226,0); }
}

.audio-status { font-size: 0.78rem; color: var(--muted); }
</style>
</head>
<body>

<div class="header">
  <div class="header-top-row">
    <div class="header-brand">ESPOLADA HOKKAIDO</div>
    <div style="display:flex;gap:8px;align-items:center;position:relative;z-index:1;">
      <a class="schedule-block" href="https://f000167a.github.io/espolada_chants/intro.html">
        <span class="schedule-icon">📣</span>
        <span class="schedule-text">応援のはじめ方</span>
      </a>
      <a class="schedule-block" href="./next-match.html">
        <span class="schedule-icon">📅</span>
        <span class="schedule-text">試合日程</span>
      </a>
    </div>
  </div>
  <div class="header-title">CHANT BOOK</div>
  <div class="header-sub">全チャント・選手コール一覧</div>
  <a class="next-match-banner" href="./next-match.html" id="next-match-banner" style="display:none;">
    <span class="next-match-banner-label">NEXT MATCH</span>
    <span class="next-match-banner-body" id="next-match-banner-body"></span>
  </a>
</div>

<div class="tabs-wrap">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('chants', this)">チームチャント</button>
    <button class="tab" onclick="switchTab('calls', this)">選手コール</button>
  </div>
</div>

<div class="list-wrap">
  <div class="tab-panel active" id="panel-chants">
    <div id="chant-list"></div>
  </div>
  <div class="tab-panel" id="panel-calls">
    <div id="call-list"></div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-close-row">
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div id="modal-inner"></div>
      <div class="audio-row" style="display:none;">
        <button class="play-btn" id="modal-play" onclick="toggleAudio()">
          <svg id="modal-icon" width="12" height="14" viewBox="0 0 12 14" fill="currentColor">
            <path d="M0 0 L12 7 L0 14 Z"/>
          </svg>
        </button>
        <div class="audio-status" id="audio-status">音源準備中</div>
      </div>
    </div>
  </div>
</div>

<script>
const chants = [

  { title: "バモバモ北海道",

  { title: "エスポラーダGO",

  { no: "18", pos: "FP", title: "宮原 勇哉", read: "みやはら ゆうき", call: ["みっやはら　みやはら＊＊", "みっやはら　みやはら＊＊"], origin: "日曜日よりの使者",

  { no: "19", pos: "FP", title: "中浦 慶大", read: "なかうら けいた", call: "けいた＊＊＊　けいた＊＊＊", chant: null, audio: null },
  { no: "20", pos: "FP", title: "佐藤 明生", read: "さとう あきお", call: "あきお＊＊＊　あきお＊＊＊", origin: "We Will Rock You",
    chant: ["わーれーらーの　あきお", "行ーけー行ーけー　あきお"], audio: null },
  { no: "22", pos: "FP", title: "髙橋 翼", read: "たかはし つばさ", call: "＊　＊＊＊つばさ　＊　＊＊＊つばさ", chant: null, audio: null },
  { no: "24", pos: "FP", title: "荒谷 洸介", read: "あらや こうすけ", call: "こうすけ＊＊＊　こうすけ＊＊＊", chant: null, audio: null },
  { no: "25", pos: "GK", title: "吉川 頼", read: "よしかわ らい", call: "らーい　らーい　らーい", chant: null, audio: null },
];

// ── ヘルパー ──
function hasAsterisk(lines) {
  return lines.some(l => l.includes("＊"));
}

function renderModalLines(lines, isChant) {
  const boxClass = isChant ? "" : " is-call";
  const lineClass = isChant ? "" : " is-call-line";
  return `<div class="modal-lines${boxClass}">
    ${lines.map(l => `<div class="modal-line${lineClass}">${l}</div>`).join("")}
  </div>`;
}

// ── レンダリング ──
function renderChants() {
  const el = document.getElementById("chant-list");
  chants.forEach(item => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <span class="item-name">${item.title}</span>
      <div class="item-badges"><span class="badge badge-lyrics">歌詞</span></div>
      <span class="item-chevron">›</span>`;
    div.addEventListener("click", () => openModalChant(item));
    el.appendChild(div);
  });
}

function renderCalls() {
  const el = document.getElementById("call-list");
  calls.forEach(item => {
    const div = document.createElement("div");
    div.className = "item" + (item.call ? "" : " wip");
    const posBg = item.pos === "GK" ? "#e8f6fd" : "#f0f4ff";
    const posColor = item.pos === "GK" ? "#1a8fc4" : "#4a5fa8";
    let badges = item.call
      ? `<span class="badge badge-call">コール</span>`
      : `<span class="badge" style="background:#f0f0f0;color:#aaa;border-color:#e0e0e0;">準備中</span>`;
    if (item.chant) badges += `<span class="badge badge-chant">チャント</span>`;
    div.innerHTML = `
      <span class="item-name">
        <span style="font-size:0.72rem;color:var(--muted);margin-right:4px;">#${item.no}</span><span style="display:inline-block;font-size:0.65rem;font-weight:900;padding:1px 6px;border-radius:4px;background:${posBg};color:${posColor};margin-right:6px;">${item.pos}</span>${item.title}<span style="font-size:0.72rem;color:var(--muted);font-weight:400;margin-left:5px;">（${item.read}）</span>
      </span>
      <div class="item-badges">${badges}</div>
      <span class="item-chevron">${item.call ? "›" : ""}</span>`;
    if (item.call) div.addEventListener("click", () => openModalCall(item));
    el.appendChild(div);
  });
}

function switchTab(id, btn) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("panel-" + id).classList.add("active");
}

// ── MODAL ──
let currentAudio = null;
let currentItem = null;

function openModalChant(item) {
  currentItem = item;
  document.getElementById("modal-inner").innerHTML = `
    <div class="modal-type">チームチャント</div>
    <div class="modal-title">${item.title}</div>
    ${item.origin ? `<div class="modal-origin">♪ ${item.origin}</div>` : ""}
    <div class="modal-section-label">歌詞</div>
    ${renderModalLines(item.lines, true)}`;
  setupAudio(item.audio);
  document.getElementById("overlay").classList.add("open");
}

function openModalCall(item) {
  currentItem = item;
  stopAudio();
  const posBg = item.pos === "GK" ? "#e8f6fd" : "#f0f4ff";
  const posColor = item.pos === "GK" ? "#1a8fc4" : "#4a5fa8";
  let inner = `
    <div class="modal-type">選手コール</div>
    <div class="modal-title">
      <span style="font-size:0.85rem;color:var(--muted);margin-right:5px;">#${item.no}</span><span style="display:inline-block;font-size:0.7rem;font-weight:900;padding:2px 8px;border-radius:4px;background:${posBg};color:${posColor};margin-right:8px;vertical-align:middle;">${item.pos}</span>${item.title}
      <div style="font-size:0.8rem;color:var(--muted);font-weight:400;margin-top:3px;">（${item.read}）</div>
    </div>
    <div class="modal-section-label">コール</div>
    ${renderModalLines([].concat(item.call), false)}`;
  if (item.chant) {
    inner += `<div class="modal-divider"></div>
      <div class="modal-section-label">チャント</div>
      ${item.origin ? `<div class="modal-origin">♪ ${item.origin}</div>` : ""}
      ${renderModalLines(item.chant, true)}`;
  }
  document.getElementById("modal-inner").innerHTML = inner;
  setupAudio(item.audio);
  document.getElementById("overlay").classList.add("open");
}

function setupAudio(src) {
  stopAudio();
  const btn = document.getElementById("modal-play");
  const icon = document.getElementById("modal-icon");
  const status = document.getElementById("audio-status");
  icon.innerHTML = '<path d="M0 0 L12 7 L0 14 Z"/>';
  btn.classList.remove("playing");
  btn.disabled = !src;
  status.textContent = src ? "タップして再生" : "音源準備中";
}

function closeModal() {
  stopAudio();
  document.getElementById("overlay").classList.remove("open");
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById("overlay")) closeModal();
}

function stopAudio() {
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; currentAudio = null; }
  const p = document.getElementById("modal-play");
  const i = document.getElementById("modal-icon");
  if (p) p.classList.remove("playing");
  if (i) i.innerHTML = '<path d="M0 0 L12 7 L0 14 Z"/>';
}

function toggleAudio() {
  if (!currentItem?.audio) return;
  const btn = document.getElementById("modal-play");
  const icon = document.getElementById("modal-icon");
  const status = document.getElementById("audio-status");
  if (currentAudio && !currentAudio.paused) {
    stopAudio(); status.textContent = "タップして再生"; return;
  }
  if (!currentAudio) currentAudio = new Audio(currentItem.audio);
  currentAudio.play();
  currentAudio.onended = () => { stopAudio(); status.textContent = "タップして再生"; };
  btn.classList.add("playing");
  icon.innerHTML = '<rect x="0" y="0" width="4" height="14" rx="1"/><rect x="8" y="0" width="4" height="14" rx="1"/>';
  status.textContent = "再生中";
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

let swipeY = 0;
document.querySelector(".modal").addEventListener("touchstart", e => { swipeY = e.touches[0].clientY; }, { passive: true });
document.querySelector(".modal").addEventListener("touchend", e => { if (e.changedTouches[0].clientY - swipeY > 60) closeModal(); }, { passive: true });

renderChants();
renderCalls();

// ── 次の試合案内 ──
async function loadNextMatchBanner() {
  const res = await fetch("./schedule.json");
  const data = await res.json();
  const nextMatch = data.matches.find(m => !m.result);
  if (!nextMatch) return;

  const DAYS = ["日","月","火","水","木","金","土"];
  let dateText = "日程未定";
  if (nextMatch.date) {
    const d = new Date(nextMatch.date + "T00:00:00");
    dateText = `${d.getMonth()+1}/${d.getDate()}（${DAYS[d.getDay()]}）`;
    if (nextMatch.time) dateText += ` ${nextMatch.time} KO`;
  }
  const haText = nextMatch.home ? "🏠 HOME" : "✈️ AWAY";
  const venueText = nextMatch.venue && nextMatch.venue !== "未定" ? nextMatch.venue : "会場未定";

  document.getElementById("next-match-banner-body").textContent =
    `${dateText}｜vs ${nextMatch.opponent}（${haText}）｜${venueText}`;
  document.getElementById("next-match-banner").style.display = "flex";
}

loadNextMatchBanner().catch(() => {});
</script>
